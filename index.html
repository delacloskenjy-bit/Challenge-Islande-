<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a6f7a">
<title>CHALLENGE ISLAND</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6fbf6;--card:#fff;--tx:#073b4c;--mut:#4d7f89;--lag:#0fb5a6;--deep:#0a6f7a;--pink:#ff4f8b;--sun:#ffc93c;--ok:#12a36b;--ko:#e5484d;--bd:#b9e8df;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#04262e;--card:#0a3d49;--tx:#e9fffb;--mut:#93cbd0;--bd:#14606c;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
#app{max-width:480px;margin:0 auto;padding:0 16px 96px}
h1,h2,h3{font-family:"Baloo 2",system-ui,sans-serif;margin:0;line-height:1.1}
.hero{margin:0 -16px 16px;padding:28px 20px 40px;background:linear-gradient(180deg,#ffb347,#ff4f8b 55%,#0fb5a6);color:#fff;position:relative;overflow:hidden;border-radius:0 0 28px 28px}
.hero h1{font-size:34px;font-weight:800;text-shadow:0 2px 0 rgba(0,0,0,.15)}
.hero p{margin:6px 0 0;opacity:.95}
.sun{position:absolute;right:-20px;top:-20px;width:110px;height:110px;border-radius:50%;background:var(--sun);animation:glow 4s ease-in-out infinite}
@keyframes glow{50%{transform:scale(1.08);box-shadow:0 0 40px #ffe08a}}
.wave{position:absolute;left:0;bottom:-2px;width:200%;height:22px;animation:wv 7s linear infinite}
@keyframes wv{to{transform:translateX(-50%)}}
.card{background:var(--card);border:2px solid var(--bd);border-radius:20px;padding:16px;margin:12px 0;animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.97);opacity:0}}
.bar{height:12px;border-radius:9px;background:var(--bd);overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),var(--pink));transition:width .5s}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:14px;margin:10px 0;font:700 17px "Baloo 2",system-ui,sans-serif;background:var(--deep);color:#fff;cursor:pointer;transition:transform .12s}
.btn:active{transform:scale(.97)}.btn.big{background:var(--pink);font-size:20px;padding:18px}
.btn.alt{background:var(--card);color:var(--tx);border:2px solid var(--bd)}
.btn:disabled{opacity:.5}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:14px;padding:13px 14px;margin:8px 0;font:inherit;cursor:pointer}
.opt.ok{background:var(--ok);border-color:var(--ok);color:#fff;animation:pop .3s}
.opt.ko{background:var(--ko);border-color:var(--ko);color:#fff;animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.row{display:flex;gap:8px}.row>*{flex:1}
.chip{border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:14px;padding:10px 6px;font:600 14px inherit;cursor:pointer;text-align:center}
.chip.on{background:var(--lag);border-color:var(--lag);color:#fff}
.chip:disabled{opacity:.45}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.badge{text-align:center;padding:12px 8px;border-radius:16px;border:2px solid var(--bd);background:var(--card)}
.badge b{font-size:34px;display:block}.badge.off{filter:grayscale(1);opacity:.45}
small,.mut{color:var(--mut)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--card);border-top:2px solid var(--bd);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav div{display:flex;max-width:480px;width:100%}
nav button{flex:1;border:0;background:none;color:var(--mut);font:600 12px system-ui;padding:6px;cursor:pointer}
nav button b{display:block;font-size:22px}nav button.on{color:var(--pink)}
.big-n{font:800 44px "Baloo 2",system-ui}
input{width:100%;padding:12px;margin:6px 0;border:2px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div id="app"></div>
<nav><div id="nav"></div></nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// [catégorie, difficulté 1-3, question, réponses, index bonne réponse]
const Q=[
['r',1,"Quel est le chef-lieu de La Réunion ?",["Saint-Pierre","Saint-Denis","Le Port","Saint-Paul"],1],
['r',1,"Comment s’appelle le volcan actif de l’île ?",["Piton des Neiges","Piton de la Fournaise","Grand Bénare","Maïdo"],1],
['r',1,"Quel fruit rouge est une star de l’île en décembre ?",["Le letchi","La pomme","La cerise","La fraise"],0],
['r',1,"Quel plat se prépare avec des saucisses et des tomates ?",["Le rougail saucisse","La paella","Le couscous","La raclette"],0],
['r',2,"Combien de cirques compte l’île ?",["2","3","4","5"],1],
['r',2,"Quel est le point culminant de La Réunion ?",["Piton des Neiges","Piton de la Fournaise","Cilaos","Maïdo"],0],
['r',2,"La Réunion fait partie de l’archipel des…",["Comores","Seychelles","Mascareignes","Maldives"],2],
['r',3,"Quelle fête, le 20 décembre, commémore l’abolition de l’esclavage (1848) ?",["Fèt Kaf","Dipavali","Fête des fleurs","Carnaval"],0],
['c',1,"Quelle est la capitale de l’Australie ?",["Sydney","Melbourne","Canberra","Perth"],2],
['c',1,"Quelle planète est surnommée la planète rouge ?",["Vénus","Mars","Jupiter","Mercure"],1],
['c',1,"Qui a peint la Joconde ?",["Van Gogh","Picasso","Léonard de Vinci","Monet"],2],
['c',1,"Combien y a-t-il de continents ?",["5","6","7","8"],2],
['c',2,"Quel est le plus grand océan du monde ?",["Atlantique","Indien","Arctique","Pacifique"],3],
['c',2,"Qui a écrit « Les Misérables » ?",["Victor Hugo","Émile Zola","Molière","Balzac"],0],
['c',2,"En quelle année la France a-t-elle gagné la Coupe du monde pour la 2ᵉ fois ?",["1998","2006","2018","2022"],2],
['c',3,"Quel est le symbole chimique de l’or ?",["Or","Ag","Au","Go"],2],
['l',1,"Suite : 2, 4, 8, 16, ?",["24","32","30","20"],1],
['l',1,"Suite : 10, 20, 30, ?, 50",["35","40","45","25"],1],
['l',1,"Un panier contient 6 œufs. Tu en prends 4. Combien en as-tu ?",["2","4","6","10"],1],
['l',2,"Suite : 1, 1, 2, 3, 5, 8, ?",["11","12","13","14"],2],
['l',2,"Combien de mois de l’année ont 28 jours ?",["1","2","6","12"],3],
['l',2,"Suite : 3, 6, 12, 24, ?",["36","48","30","42"],1],
['l',3,"3 machines font 3 pièces en 3 minutes. Combien de temps pour 100 machines et 100 pièces ?",["3 minutes","100 minutes","33 minutes","1 minute"],0],
['l',3,"Suite : 2, 3, 5, 7, 11, ?",["12","13","15","14"],1]];
const CATS={r:["🌋","La Réunion"],c:["🌍","Culture générale"],l:["🧩","Logique"]};
const DN=["","Facile","Moyen","Difficile"];
const B=[["first","🌴","Premier pas","Terminer une partie",s=>s.played>=1],["isl","🌋","Insulaire","10 bonnes réponses sur La Réunion",s=>s.cat.r>=10],["perf","🎯","Sans faute","Réussir un 5/5",s=>s.perfect>=1],["day","☀️","Défi relevé","Terminer un défi du jour",s=>!!s.daily],["str","🔥","Régulier","Jouer 3 jours d’affilée",s=>s.streak>=3],["l5","👑","Roi de l’île","Atteindre le niveau 5",s=>lvl()>=5]];
let S={xp:0,pts:0,played:0,good:0,total:0,perfect:0,seen:[],cat:{r:0,c:0,l:0},streak:0,last:"",daily:"",badges:[]};
try{Object.assign(S,JSON.parse(localStorage.getItem("ci")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("ci",JSON.stringify(S))}catch(e){}};
const lvl=()=>Math.floor(S.xp/100)+1;
const day=(o=0)=>new Date(Date.now()-o*864e5).toISOString().slice(0,10);
const $=id=>document.getElementById(id);
let v="home",G=null,P={cat:"r",d:1},rs=false,RP="week",RK=null,U=null,PS="",sb=null;
const SB_URL="https://bfjcsjxhssqtsasofhvi.supabase.co",SB_KEY="sb_publishable_lOgwL7hs6_RRUYZ1K8xboA_V3Vppk88";
try{sb=window.supabase.createClient(SB_URL,SB_KEY)}catch(e){}
const esc=s=>String(s).replace(/[&<>"']/g,c=>"&#"+c.charCodeAt(0)+";");
const say=m=>{const x=$("msg");if(x)x.textContent=m};
async function loadU(){if(!sb)return;try{const{data}=await sb.auth.getSession();U=data.session?data.session.user:null;PS=U?(U.user_metadata.pseudo||""):"";render()}catch(e){}}
async function sign(up){const e=$("em").value.trim(),p=$("pw").value,n=$("ps").value.trim();
 if(!e||p.length<8)return say("E-mail et mot de passe (8 caractères min.) requis.");
 if(up&&(n.length<3||n.length>20))return say("Pseudo : 3 à 20 caractères.");
 say("Un instant…");
 const r=up?await sb.auth.signUp({email:e,password:p,options:{data:{pseudo:n}}}):await sb.auth.signInWithPassword({email:e,password:p});
 if(r.error)return say(/database/i.test(r.error.message)?"Ce pseudo est déjà pris.":r.error.message);
 if(up&&!r.data.session)return say("Compte créé. Confirme ton e-mail, puis connecte-toi.");
 loadU()}
async function out(){await sb.auth.signOut();loadU()}
async function loadRank(p){RK=null;render();try{const{data,error}=await sb.rpc("classement",{periode:p});RK=error?[]:data}catch(e){RK=[]}render()}
const acct=()=>!sb?"":U?`<div class="card"><h3>👤 ${esc(PS||"Joueur")}</h3><small>${esc(U.email)}</small><button class="btn alt" onclick="out()">Se déconnecter</button></div>`:`<div class="card"><h3>Connexion</h3><small>Pour apparaître au classement.</small><input id="ps" placeholder="Pseudo (inscription seulement)" maxlength="20"><input id="em" type="email" placeholder="E-mail" autocomplete="email"><input id="pw" type="password" placeholder="Mot de passe (8 caractères min.)" autocomplete="current-password"><button class="btn" onclick="sign(1)">Créer mon compte</button><button class="btn alt" onclick="sign(0)">Me connecter</button><p id="msg" class="mut"></p></div>`;
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function seed(s){let h=0;for(const c of s)h=Math.imul(31,h)+c.charCodeAt(0)|0;return h}
function mk(i){const q=Q[i];return{id:i,cat:q[0],d:q[1],q:q[2],o:q[3].map((t,k)=>({t,ok:k===q[4]})).sort(()=>Math.random()-.5)}}
function start(mode){
  let ids;
  if(mode==="d"){const r=rng(seed(day()));ids=Q.map((_,i)=>i).sort((a,b)=>r()-.5).slice(0,5)}
  else{ids=Q.map((_,i)=>i).filter(i=>Q[i][0]===P.cat).map(i=>({i,k:(Q[i][1]===P.d?0:10)+(S.seen.includes(i)?5:0)+Math.random()*4})).sort((a,b)=>a.k-b.k).slice(0,5).map(x=>x.i)}
  G={mode,qs:ids.map(mk),i:0,ok:0,pts:0,pick:null,nb:[]};go("quiz")}
function answer(k){if(G.pick!==null)return;G.pick=k;const q=G.qs[G.i];if(q.o[k].ok){G.ok++;G.pts+=10*q.d;S.cat[q.cat]++}render()}
function next(){if(G.i>=4)return finish();G.i++;G.pick=null;render()}
function finish(){
  let xp=G.ok*10+(G.ok===5?20:0),pts=G.pts;
  if(G.mode==="d"&&S.daily!==day()){pts*=2;xp+=20;S.daily=day()}
  G.xp=xp;G.gain=pts;S.xp+=xp;S.pts+=pts;S.played++;S.good+=G.ok;S.total+=5;if(G.ok===5)S.perfect++;
  G.qs.forEach(q=>{if(!S.seen.includes(q.id))S.seen.push(q.id)});
  if(S.last!==day()){S.streak=S.last===day(1)?S.streak+1:1;S.last=day()}
  B.forEach(b=>{if(!S.badges.includes(b[0])&&b[4](S)){S.badges.push(b[0]);G.nb.push(b)}});
  save();if(U&&sb&&G.gain>0)sb.from("scores").insert({pts:G.gain}).then(()=>{});go("end")}
function go(x){v=x;rs=false;if(x==="rank")loadRank(RP);else render();scrollTo(0,0)}
function reset(){if(!rs){rs=true;render();return}localStorage.removeItem("ci");location.reload()}
function render(){
  const T=[["home","🏝️","Accueil"],["pick","🎮","Jouer"],["rank","🏆","Top"],["badges","🏅","Badges"],["stats","👤","Moi"]];
  $("nav").innerHTML=T.map(t=>`<button class="${v===t[0]||(v==="quiz"||v==="end")&&t[0]==="pick"?"on":""}" onclick="go('${t[0]}')"><b>${t[1]}</b>${t[2]}</button>`).join("");
  let h="";
  const hero=(t,s)=>`<div class="hero"><div class="sun"></div><h1>${t}</h1><p>${s}</p><svg class="wave" viewBox="0 0 800 22" preserveAspectRatio="none"><path d="M0 11Q50 0 100 11T200 11T300 11T400 11T500 11T600 11T700 11T800 11V22H0Z" fill="var(--bg)"/></svg></div>`;
  if(v==="home"){const d=S.daily===day();
    h=hero("CHALLENGE ISLAND","Relève les défis de l’île !")+`<div class="card"><h3>Niveau ${lvl()}</h3><div class="bar"><i style="width:${S.xp%100}%"></i></div><small>${S.xp%100}/100 XP · ${S.pts} points · 🔥 ${S.streak} jour${S.streak>1?"s":""} d’affilée</small></div>
    <button class="btn big" onclick="start('d')">☀️ ${d?"Rejouer le défi du jour":"Défi du jour (points ×2)"}</button>
    <button class="btn" onclick="go('pick')">🎮 Choisir un quiz</button>
    <p class="mut" style="text-align:center"><small>Les points sont virtuels et ne donnent droit à aucun gain.</small></p>`}
  if(v==="pick"){
    h=hero("Jouer","5 questions par partie")+`<div class="card"><h3>Thème</h3><div class="row" style="margin-top:10px">${Object.keys(CATS).map(k=>`<button class="chip ${P.cat===k?"on":""}" onclick="P.cat='${k}';render()">${CATS[k][0]}<br>${CATS[k][1]}</button>`).join("")}</div></div>
    <div class="card"><h3>Difficulté</h3><div class="row" style="margin-top:10px">${[1,2,3].map(d=>`<button class="chip ${P.d===d?"on":""}" ${lvl()<d?"disabled":""} onclick="P.d=${d};render()">${lvl()<d?"🔒 ":""}${DN[d]}${lvl()<d?`<br><small>Niveau ${d}</small>`:""}</button>`).join("")}</div></div>
    <button class="btn big" onclick="start('q')">C’est parti !</button>`}
  if(v==="quiz"){const q=G.qs[G.i];
    h=`<div style="padding-top:16px"><small>${CATS[q.cat][0]} ${CATS[q.cat][1]} · ${DN[q.d]} · ${G.i+1}/5</small><div class="bar"><i style="width:${(G.i+(G.pick!==null))*20}%"></i></div></div><div class="card"><h2 style="font-size:22px">${q.q}</h2></div>`+
    q.o.map((o,k)=>`<button class="opt ${G.pick!==null?(o.ok?"ok":G.pick===k?"ko":""):""}" ${G.pick!==null?"disabled":""} onclick="answer(${k})">${o.t}</button>`).join("")+
    (G.pick!==null?`<button class="btn big" onclick="next()">${G.i>=4?"Voir mon résultat":"Question suivante"}</button>`:"")}
  if(v==="end"){
    h=hero(G.ok>=4?"Bravo !":G.ok>=2?"Bien joué !":"Continue !",`${G.ok} bonne${G.ok>1?"s":""} réponse${G.ok>1?"s":""} sur 5`)+`<div class="card" style="text-align:center"><div class="big-n">+${G.gain} pts</div><p>+${G.xp} XP${G.mode==="d"?" (bonus défi du jour inclus)":""}</p></div>`+
    G.nb.map(b=>`<div class="card" style="text-align:center"><b style="font-size:40px">${b[1]}</b><h3>Nouveau badge : ${b[2]}</h3><small>${b[3]}</small></div>`).join("")+
    `<button class="btn big" onclick="go('pick')">Rejouer</button><button class="btn alt" onclick="go('home')">Retour à l’accueil</button>`}
  if(v==="rank"){h=hero("Classement","Les meilleurs de l’île")+`<div class="row"><button class="chip ${RP==="week"?"on":""}" onclick="RP='week';loadRank('week')">Cette semaine</button><button class="chip ${RP==="general"?"on":""}" onclick="RP='general';loadRank('general')">Général</button></div>`+(!sb?`<div class="card">Connexion en ligne indisponible.</div>`:RK===null?`<div class="card">Chargement…</div>`:RK.length?RK.map((r,i)=>`<div class="card row" style="align-items:center"><b style="flex:0 0 36px">${["🥇","🥈","🥉"][i]||i+1}</b><span style="flex:3">${esc(r.pseudo)}</span><b style="flex:1;text-align:right">${r.pts}</b></div>`).join(""):`<div class="card">Aucun score pour l’instant. Crée un compte dans l’onglet Moi, puis joue !</div>`)}
  if(v==="badges"){
    h=hero("Badges",`${S.badges.length}/${B.length} débloqués`)+`<div class="grid">${B.map(b=>`<div class="badge ${S.badges.includes(b[0])?"":"off"}"><b>${b[1]}</b><h3 style="font-size:17px">${b[2]}</h3><small>${b[3]}</small></div>`).join("")}</div>`}
  if(v==="stats"){const p=S.total?Math.round(S.good/S.total*100):0;
    h=hero("Mon espace","Compte et progression")+acct()+`<div class="card"><div class="row"><div><div class="big-n">${S.played}</div><small>parties</small></div><div><div class="big-n">${p}%</div><small>de réussite</small></div></div></div>
    <div class="card"><h3>Bonnes réponses</h3><p>🌋 La Réunion : <b>${S.cat.r}</b><br>🌍 Culture générale : <b>${S.cat.c}</b><br>🧩 Logique : <b>${S.cat.l}</b></p><small>${S.seen.length}/${Q.length} questions déjà vues · ${S.perfect} partie${S.perfect>1?"s":""} parfaite${S.perfect>1?"s":""} · ${S.xp} XP</small></div>
    <button class="btn alt" onclick="reset()">${rs?"Confirmer : tout effacer":"Effacer ma progression"}</button>`}
  $("app").innerHTML=h}
render();loadU();
</script></body></html>
